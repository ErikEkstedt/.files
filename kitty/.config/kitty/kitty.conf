# vim:fileencoding=utf-8:ft=conf:foldmethod=marker:ft=kitty
# https://sw.kovidgoyal.net/kitty/conf.html

# Settings
editor nvim
sync_to_monitor no
hide_window_decorations no
macos_option_as_alt yes

# Cursor
cursor_shape block
cursor_blink_interval      0

# Transparancy
background_opacity 1.0
dynamic_background_opacity yes
dim_opacity 0.1

# Tabs
tab_bar_edge top
tab_bar_style slant
tab_bar_align left

# Colorscheme
# include themes/onedark.conf
# include themes/monokai.conf
# include themes/kanagawa.conf
include themes/material.conf

# Mappings
# include mappings.conf
kitty_mod ctrl+cmd

map kitty_mod+p load_config_file
map cmd+p load_config_file
map alt+shift+p debug_config
map alt+shift+0 send_text all ~

map ctrl+shift+v paste_from_clipboard
map cmd+v paste_from_clipboard
map ctrl+shift+t new_tab

map ctrl+plus   change_font_size all +1.0
map ctrl+minus  change_font_size all -1.0
map cmd+minus  change_font_size all -1.0
map cmd+plus  change_font_size all +1.0
map kitty_mod+i set_background_opacity +0.05
map kitty_mod+o set_background_opacity -0.05

# OS-specific: https://github.com/kovidgoyal/kitty/issues/811
# - Fonts
# No good ENV-variable available to have OS-specific configs (only $USER)
# run: `kitty list-fonts` to see which fonts are available
# include ${uname}.conf
# include ${UNAME}.conf
# font_family DejaVuSansM Nerd Font Mono
# font_family FiraCode Nerd Font
font_family JetBrainsMono Nerd Font
# font_family Mononoki Nerd Font
# font_family SauceCodePro NF
font_size 10.0
url_style curly
modify_font underline_position 2
modify_font underline_thickness 1
box_drawing_scale 0.001, 1, 1.5, 2

#: Window layout
window_border_width 1
draw_minimal_borders yes
inactive_text_alpha 1.
